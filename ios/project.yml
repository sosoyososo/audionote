name: AudioNote
options:
  bundleIdPrefix: info.karsa.app
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AudioNote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AudioNote
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: AudioNote/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: info.karsa.app.ios.audionote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: 8V95JS2XCZ
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: AudioNote/Resources/Info.plist
      properties:
        CFBundleName: AudioNote
        CFBundleDisplayName: AudioNote
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UILaunchStoryboardName: "LaunchScreen"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}

  AudioNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AudioNoteTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: info.karsa.app.ios.audionote.tests
    dependencies:
      - target: AudioNote

  # An `AudioNoteUITests` target used to be declared here with
  # `sources: - path: AudioNoteUITests`, but that directory does not exist.
  # xcodegen validates a `sources` path eagerly and exits 1 WITHOUT writing
  # project.pbxproj, so `xcodegen generate` appeared to succeed while silently
  # leaving a stale project behind — and every `xcodebuild test` then had to be
  # scoped with `-only-testing:AudioNoteTests` to work around it. There are no
  # UI tests in this project, so the target was removed rather than stubbed.
  # Add it back (plus the directory) when there is a UI test to put in it.
